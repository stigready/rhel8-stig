---
# StigForge supplements for RHEL 8 STIG - not overwritten by `stigforge generate`.
# SSG playbook gaps (dnf localpkg_gpgcheck, no-remediation DNS) and verify-image hygiene.

- name: Ensure GPG check enabled for local packages (dnf)
  community.general.ini_file:
    dest: /etc/dnf/dnf.conf
    section: main
    option: localpkg_gpgcheck
    value: "1"
    no_extra_spaces: true
    create: true
  tags:
    - ensure_gpgcheck_local_packages

# RHEL-09-252035 / network_configure_name_resolution - "Configure Multiple DNS Servers
# in /etc/resolv.conf". The STIG offers two branches: if nsswitch has no `dns`, resolv.conf
# must be EMPTY; if it has `dns`, resolv.conf must carry >=2 nameservers.
#
# This role used to take the empty branch - it stripped `dns` from nsswitch and truncated
# /etc/resolv.conf. The OVAL check passed and name resolution was gone. On 2026-09-20 that
# failed five consecutive release legs across rhel-8, rhel-9 and alma-9; the alma-9 leg named
# it outright (`Curl error (6): Could not resolve host: mirrors.almalinux.org`), which also
# shows the long-standing `rhsm-repomd-unreachable` RCA was reading a DNS failure as a
# subscription one - Alma uses no RHSM. It was not only a build defect: a customer's STIG AMI
# would have booted with no resolver.
#
# The rule's own rationale forbids that reading: "A failure in name resolution could lead to
# the failure of security functions requiring name resolution, which may include time
# synchronization, centralized authentication, and remote system logging." Emptying
# resolv.conf causes exactly what the rule exists to prevent.
#
# So: keep `dns` in nsswitch and never truncate resolv.conf here. The >=2-nameserver half is
# deliberately NOT done at this point - writing resolv.conf mid-hardening is what broke the
# build, and with NetworkManager `dns=default` (var_networkmanager_dns_mode) NM owns the file
# and would overwrite any static write after the FIPS reboot anyway. That half is tracked
# separately; until it lands, this rule scores as it truly is rather than being satisfied by
# breaking the system.
- name: Keep DNS in host resolution order (STIG name resolution - RHEL-09-252035)
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^hosts:'
    line: "hosts:      files dns myhostname"
  tags:
    - network_configure_name_resolution

- name: Find ungrouped files on local mounts (verify scope)
  ansible.builtin.shell: |
    set -euo pipefail
    mounts="$(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" -o TARGET 2>/dev/null || true)"
    for mp in $mounts; do
      find "$mp" -xdev -nogroup 2>/dev/null || true
    done
  register: stigforge_nogroup_files
  changed_when: false
  tags:
    - file_permissions_ungroupowned

- name: Assign root group to ungrouped files
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
  loop: "{{ stigforge_nogroup_files.stdout_lines | select('match', '.+') | list }}"
  when: stigforge_nogroup_files.stdout_lines | length > 0
  tags:
    - file_permissions_ungroupowned

# FIPS mode - RHEL-08-010020. Owner decision 2026-09-20: enablement belongs to the ROLE, and it is
# NOT a toggle. FIPS is derived from the STIG profile, never chosen: every `stig` image is
# FIPS and nothing else ever is. A per-rule variable would make it a choice, so these tasks
# deliberately carry only DISA/CCE tags - the generator derives a toggle from an SSG rule-id
# tag, and these do not match that pattern, so no `{{ role }}_enable_fips_mode` is created.
#
# SSG ships no ANSIBLE remediation for this rule (only `urn:xccdf:fix:script:sh` and an
# osbuild blueprint), which is why the generator emits nothing for it and it has to live
# here in the supplement - exactly what the supplement is for.
#
# Scope is enablement only. The reboot, the post-reboot verification, the `boot=UUID=`
# cmdline repair for a separate /boot, and pinning the FIPS kernel against the autoremover
# stay in the factory: they are build orchestration, not configuration.
- name: FIPS | Check whether FIPS mode is already enabled
  ansible.builtin.command: fips-mode-setup --check
  register: stigforge_fips_check
  changed_when: false
  failed_when: false
  tags:
    - DISA-STIG-RHEL-08-010020
    - CCE-80942-6
    - high_severity

- name: FIPS | Enable FIPS mode (RHEL-08-010020)
  ansible.builtin.command: fips-mode-setup --enable
  register: stigforge_fips_enable
  # Idempotency guard, not an opt-out: re-running on an already-FIPS host is a no-op.
  when: "'FIPS mode is enabled' not in (stigforge_fips_check.stdout | default(''))"
  changed_when: stigforge_fips_enable.rc == 0
  failed_when: stigforge_fips_enable.rc != 0
  tags:
    - DISA-STIG-RHEL-08-010020
    - CCE-80942-6
    - high_severity
    - reboot_required

# ---------------------------------------------------------------------------------------
# Beyond-benchmark product hardening, moved out of the factory (decision 0021: StigForge
# roles own ALL hardening).
#
# These are NOT required by this profile. Verified against the SSG datastream:
#   - kernel_module_{dccp,freevxfs,hfs,hfsplus,jffs2,udf}_disabled are CIS rules, not STIG.
#     Only cramfs (RHEL-09-231195), sctp (RHEL-09-213060) and tipc (RHEL-09-213065) are in
#     the stig profile. On Ubuntu NONE of the nine are.
#   - sysctl_fs_suid_dumpable is in anssi/ccn/hipaa/pci-dss on RHEL and CIS on Ubuntu -
#     in neither the RHEL stig nor the RHEL cis profile.
#
# StigReady applies them to every hardened image anyway: CIS-grade module blacklisting and
# suid-dump hardening on a STIG image costs nothing at runtime and is strictly safer. That
# is a PRODUCT decision, which is why it lives in the role rather than being argued as a
# benchmark requirement.
#
# Tagged DISA/CCE only where a real identifier exists. The rest carry no rule-id tag on
# purpose - the generator derives a toggle from an SSG rule-id tag, and a product decision
# is not a per-rule opt-out. Idempotent: harmless where the profile already covers a module.
- name: Product hardening | Ensure kernel module 'cramfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cramfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install cramfs /bin/true

      blacklist cramfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'dccp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/dccp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install dccp /bin/true

      blacklist dccp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'freevxfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/freevxfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install freevxfs /bin/true

      blacklist freevxfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfs /bin/true

      blacklist hfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfsplus' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfsplus.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfsplus /bin/true

      blacklist hfsplus

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'jffs2' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/jffs2.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install jffs2 /bin/true

      blacklist jffs2

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'sctp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/sctp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install sctp /bin/true

      blacklist sctp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'tipc' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/tipc.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install tipc /bin/true

      blacklist tipc

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'udf' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/udf.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install udf /bin/true

      blacklist udf

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Disable core dumps for SUID programs (fs.suid_dumpable)
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/91-stigready-product.conf
    sysctl_set: true
    reload: true
    state: present
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# install_smartcard_packages (RHEL-08-010390) and rsyslog_remote_access_monitoring (RHEL-08-010070). The SSG playbook carries no remediation for
# either, so the generated role never applied them; stigready rhel-9:stig failed the OpenSCAP gate on both (2026-10-16, the first
# RHEL 9 STIG scan on the pinned SSG 0.1.82). Both are ordinary configuration, applied rather than exempted. The rsyslog line is the
# STIG's own fix and satisfies the three OVAL checks (auth.*, authpriv.*, daemon.*; tests/unit/test_el_stig_smartcard_rsyslog.py).
# ---------------------------------------------------------------------------------------------
- name: Install the smart card packages for multifactor authentication (openssl-pkcs11)
  ansible.builtin.dnf:
    name:
    - openssl-pkcs11
    state: present
  tags:
  - install_smartcard_packages
  - enable_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Monitor remote access methods in rsyslog (auth, authpriv and daemon to /var/log/secure)
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/60-stigready-remote-access.conf
    content: |
      # STIG rsyslog_remote_access_monitoring: log remote access methods (auth, authpriv, daemon).
      auth.*;authpriv.*;daemon.* /var/log/secure
    owner: root
    group: root
    mode: '0640'
  register: stigforge_rsyslog_remote_access
  tags:
  - rsyslog_remote_access_monitoring
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Restart rsyslog after the remote-access monitoring rule changed
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: stigforge_rsyslog_remote_access is changed
  tags:
  - rsyslog_remote_access_monitoring
  - no_reboot_needed

# chronyd_server_directive (RHEL-08-030740). The rule needs at least one `server` time source.
# The RHEL 8 cloud image's chrony.conf carries only `pool 2.rhel.pool.ntp.org`, and SSG's remediation
# skips when a pool directive exists, so nothing wrote a server line (stigready rhel-8:stig leg
# 7e60f4018b4f, 2026-10-18). The RHEL 8 OVAL's no-pool test only matches indented `pool` lines
# (`^[\s]+pool.*$`), so the column-0 pool line does not fail it; the missing server line does.
# 169.254.169.123 is the Amazon Time Sync Service, the AWS-recommended source and the one reachable
# from every VPC without internet access. Same task as rhel9_stig.
- name: Configure the Amazon Time Sync Service as a chrony server (chronyd_server_directive)
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^server\s'
    line: 'server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4'
    create: true
    mode: '0644'
  tags:
  - chronyd_server_directive
  - DISA-STIG-RHEL-08-030740
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# file_permissions_sshd_private_key (RHEL-08-010490). The generated tasks set the host keys to 0600, but on RHEL 8
# /usr/libexec/openssh/sshd-keygen (run by sshd-keygen@<type>.service) creates missing keys as
# 0640 root:ssh_keys, and cloud-init / sshd-keygen regenerate them on a fresh instance. The keys
# were 0640 again after the FIPS reboot (stigready rhel-8:stig leg 7e60f4018b4f, 2026-10-18), and
# every customer instance regenerates its keys at first boot, so a build-time chmod alone does not
# hold. The OVAL forbids any group/other permission. Fix it now and on every sshd start:
# sshd.service has `Wants=sshd-keygen.target` and `After=sshd-keygen.target` (the sshd-keygen@
# instances are part of that target), so the drop-in's ExecStartPre runs after the keys are
# generated and before sshd reads them. sshd itself accepts 0600 root-owned keys. A security
# improvement for customer instances, not only a score fix.
- name: Find the sshd host private keys (file_permissions_sshd_private_key)
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: 'ssh_host_*_key'
  register: stigforge_sshd_host_keys
  tags:
  - file_permissions_sshd_private_key
  - DISA-STIG-RHEL-08-010490
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Set the sshd host private keys to 0600 (file_permissions_sshd_private_key)
  ansible.builtin.file:
    path: '{{ item.path }}'
    mode: '0600'
  loop: '{{ stigforge_sshd_host_keys.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
  - file_permissions_sshd_private_key
  - DISA-STIG-RHEL-08-010490
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# The RHEL 8 image ships no /etc/systemd/system/sshd.service.d, and ansible.builtin.copy does not create parent
# directories: the drop-in task failed "Destination directory /etc/systemd/system/sshd.service.d does not exist"
# (stigready rhel-8:stig leg 22405459e99b, 2026-10-19). Create it first, as systemd itself would (0755 root:root).
- name: Create the sshd.service drop-in directory (file_permissions_sshd_private_key)
  ansible.builtin.file:
    path: /etc/systemd/system/sshd.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
  - file_permissions_sshd_private_key
  - DISA-STIG-RHEL-08-010490
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Re-apply 0600 to regenerated sshd host keys before every sshd start (file_permissions_sshd_private_key)
  ansible.builtin.copy:
    dest: /etc/systemd/system/sshd.service.d/50-stigready-hostkey-perms.conf
    content: |
      # StigReady: sshd-keygen@.service creates host keys 0640 root:ssh_keys; the STIG
      # (file_permissions_sshd_private_key) forbids group/other access. Runs after
      # sshd-keygen.target (sshd.service is ordered After= it) and before sshd starts.
      [Service]
      ExecStartPre=/bin/sh -c 'chmod 0600 /etc/ssh/ssh_host_*_key 2>/dev/null || true'
    owner: root
    group: root
    mode: '0644'
  register: stigforge_sshd_hostkey_dropin
  tags:
  - file_permissions_sshd_private_key
  - DISA-STIG-RHEL-08-010490
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Reload systemd after the sshd host-key drop-in changed (file_permissions_sshd_private_key)
  ansible.builtin.systemd:
    daemon_reload: true
  when: stigforge_sshd_hostkey_dropin is changed
  tags:
  - file_permissions_sshd_private_key
  - DISA-STIG-RHEL-08-010490
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# Leave auditd running. The generated rules restart auditd after editing them (`service auditd restart`, more than once per role);
# on rhel-9-arm64:cis-l2 (stigready, 2026-10-16) the second restart 14 s after the first stopped auditd and never started it. With
# the rules immutable (-e 2) and nothing reading events, the audit backlog fills and every audited syscall waits, which wedged new
# SSH sessions for an hour. Start it if needed (a no-op when running), then require a live auditd pid or fail the build.
# No rule-id tag on purpose: a product guarantee about the role's own side effects, not a per-rule opt-out.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Ensure auditd is running after the role's audit changes
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | auditd must be running (a stopped auditd with immutable rules wedges every audited syscall)
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.command: auditctl -s
  register: stigforge_auditd_status
  changed_when: false
  until: stigforge_auditd_status.stdout is regex('(?m)^pid [1-9][0-9]*$')
  retries: 12
  delay: 10
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# /var/log/tuned/tuned.log. stigready rhel-8:cis-l1 (leg 2a4cb545391b), rhel-8:cis-l2 (leg 90d7515e7be3) and rhel-8:stig (leg 8c30bc702bd7),
# 2026-10-19, failed the
# hardened-image /var/log check (`find -P /var/log/ -perm /u+xs,g+xws,o+xwrt`, i.e. log files 0640 or stricter, the mode SSG's
# file_permissions_var_log_stig OVAL requires) on /var/log/tuned/tuned.log only. tuned is an OS service: it opens its log with the
# service's default umask (022), and its own size-based rotation recreates the file the same way, so a one-time chmod would drift.
# Fix it at the source: a drop-in gives tuned.service UMask=0027 (new and rotated files 0640), and the files already on disk are
# brought to 0640 or stricter. systemd ignores the drop-in when tuned is not installed. No rule-id tag on purpose: a product guarantee
# (same tasks as rhel8_cis), not a per-rule opt-out.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Create the tuned.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tuned.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Give tuned a 0027 umask so tuned.log is created and rotated 0640
  ansible.builtin.copy:
    dest: /etc/systemd/system/tuned.service.d/50-stigready-umask.conf
    content: |
      # StigReady: tuned writes /var/log/tuned/tuned.log (and its rotations) with the service umask.
      # Hardened images keep /var/log files 0640 or stricter.
      [Service]
      UMask=0027
    owner: root
    group: root
    mode: '0644'
  register: stigforge_tuned_umask_dropin
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Reload systemd after the tuned drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: stigforge_tuned_umask_dropin is changed
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Restart tuned so the running service uses the new umask
  ansible.builtin.systemd:
    name: tuned
    state: restarted
  when:
  - stigforge_tuned_umask_dropin is changed
  - "'tuned' in ansible_facts.packages"
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Find the existing tuned logs
  ansible.builtin.find:
    paths: /var/log/tuned
    patterns: 'tuned.log*'
  register: stigforge_tuned_logs
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Set the existing tuned logs to 0640 or stricter
  ansible.builtin.file:
    path: '{{ item.path }}'
    mode: u-xs,g-wxs,o-rwxt
  loop: '{{ stigforge_tuned_logs.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
  - low_disruption
  - no_reboot_needed
